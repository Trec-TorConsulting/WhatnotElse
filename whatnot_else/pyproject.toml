[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "whatnot_else"
authors = [
    { name = "Tobey Rector", email = "trecto282@cable.comcast.com" }
]
description = "Enterprise Frappe / ERPNext custom app for Whatnot live sellers"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe",
    "google-generativeai>=0.8.0",
    "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/Trec-TorConsulting/WhatnotElse"
Repository = "https://github.com/Trec-TorConsulting/WhatnotElse.git"
